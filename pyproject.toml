[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "stiffgwpy_fast"
version = "0.2.1"
description = "LCDM + stiff matter + primordial stochastic gravitational-wave background (SGWB), with plain-grid as the default fast profile and an independent continuous-sigma reference oracle."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE.md"]
authors = [{name = "jiuluo-if", email = "2966684515@qq.com"}]
keywords = ["cosmology", "gravitational-waves", "stiff", "sgwb", "cobaya", "numba"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "astropy",
    "pyyaml",
    "numba",
]

[project.optional-dependencies]
cobaya = ["cobaya>=3.6,<3.7"]
mpi = ["mpi4py"]
dev = ["matplotlib", "pytest", "pytest-cov", "build", "ruff", "mypy>=1.8,<2"]
release = ["twine"]

[project.urls]
Homepage = "https://github.com/jiuluo-if/stiffGWpy_fast"
Source = "https://github.com/jiuluo-if/stiffGWpy_fast"
PyPI = "https://pypi.org/project/stiffgwpy-fast/"

[tool.setuptools]
packages = [
    "stiffgwpy_fast",
    "stiffgwpy_fast.cobaya",
    "stiffgwpy_fast.cobaya.likelihoods",
    "stiffgwpy_fast.cobaya.likelihoods.LIGO_SGWB",
    "stiffgwpy_fast.cobaya.likelihoods.PTA",
    "stiffgwpy_fast.cobaya.likelihoods.PTA.EPTAdr2",
    "stiffgwpy_fast.cobaya.likelihoods.PTA.NANOGrav15yr",
]

[tool.setuptools.package-data]
stiffgwpy_fast = ["*.dat", "*.npz"]
"stiffgwpy_fast.cobaya" = ["*.yaml"]
"stiffgwpy_fast.cobaya.likelihoods.LIGO_SGWB" = ["*.dat", "*.yaml"]
"stiffgwpy_fast.cobaya.likelihoods.PTA" = ["*.yaml"]
"stiffgwpy_fast.cobaya.likelihoods.PTA.EPTAdr2" = ["*.dat", "*.txt"]
"stiffgwpy_fast.cobaya.likelihoods.PTA.NANOGrav15yr" = ["*.npy"]

[tool.setuptools.exclude-package-data]
"stiffgwpy_fast.cobaya" = ["mcmc_compare.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not slow'"
markers = [
    "slow: long-running tests that run the full LSODA solve",
    "cobaya: integration tests requiring the Cobaya runtime",
]

[tool.ruff]
line-length = 120
target-version = "py39"
exclude = ["docs", "LICENSE.md", "stiffgwpy_fast/cobaya/likelihoods"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W"]

[tool.mypy]
python_version = "3.9"
files = "stiffgwpy_fast/config.py,stiffgwpy_fast/_resources.py"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
follow_imports = "skip"

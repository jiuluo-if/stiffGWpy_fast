[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "stiffgwpy"
version = "0.2.0"
description = "LCDM + stiff matter + primordial stochastic gravitational-wave background (SGWB), with a two-profile fast solver (plain-grid speed-first, transition-refine precision-first) and an independent continuous-sigma reference oracle."
readme = "README.md"
license = {file = "LICENSE.md"}
authors = [{name = "jiuluo-if"}]
keywords = ["cosmology", "gravitational-waves", "stiff", "sgwb", "cobaya", "numba"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "astropy",
    "pyyaml",
    "numba",
]

[project.optional-dependencies]
cobaya = ["cobaya>=3.6,<3.7", "mpi4py"]
dev = ["matplotlib", "pytest", "pytest-cov", "build", "ruff"]

[project.urls]
Homepage = "https://github.com/jiuluo-if/stiffGWpy_fast"
Source = "https://github.com/jiuluo-if/stiffGWpy_fast"

[tool.setuptools]
packages = [
    "stiffgwpy",
    "stiffgwpy.cobaya",
    "stiffgwpy.cobaya.likelihoods",
    "stiffgwpy.cobaya.likelihoods.LIGO_SGWB",
    "stiffgwpy.cobaya.likelihoods.PTA",
    "stiffgwpy.cobaya.likelihoods.PTA.EPTAdr2",
    "stiffgwpy.cobaya.likelihoods.PTA.NANOGrav15yr",
]

[tool.setuptools.package-data]
stiffgwpy = ["*.dat", "*.npz"]
"stiffgwpy.cobaya" = ["*.yaml"]
"stiffgwpy.cobaya.likelihoods.LIGO_SGWB" = ["*.dat", "*.yaml"]
"stiffgwpy.cobaya.likelihoods.PTA" = ["*.yaml"]
"stiffgwpy.cobaya.likelihoods.PTA.EPTAdr2" = ["*.dat", "*.txt"]
"stiffgwpy.cobaya.likelihoods.PTA.NANOGrav15yr" = ["*.npy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not slow'"
markers = [
    "slow: long-running tests that run the full LSODA solve",
    "cobaya: integration tests requiring the Cobaya runtime",
]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W"]
exclude = ["docs", "LICENSE.md", "stiffgwpy/cobaya/likelihoods"]

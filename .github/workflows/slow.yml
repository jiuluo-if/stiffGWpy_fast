name: slow numerical validation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 0"

env:
  NUMBA_NUM_THREADS: "2"
  NUMBA_THREADING_LAYER: workqueue
  FAST_THREADS: "2"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  slow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
      - name: Slow LSODA and reference gates
        run: python -m pytest -m slow -q

name: slow numerical validation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 0"

jobs:
  slow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
      - name: Slow LSODA and reference gates
        run: python -m pytest -m slow -q

name: ci

on:
  push:
  pull_request:

env:
  NUMBA_NUM_THREADS: "2"
  NUMBA_THREADING_LAYER: workqueue
  FAST_THREADS: "2"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
      - name: Compatibility smoke
        run: python -m pytest -q tests/test_compatibility_smoke.py

  canonical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
      - name: Canonical regression and coverage
        run: python -m pytest -q --cov=stiffgwpy_fast --cov-report=term-missing:skip-covered --cov-report=xml
      - name: Validation manifest schema
        run: python scripts/validate_manifest.py
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
      - name: 中文注释门禁
        env:
          BASE_SHA: ${{ github.event.before }}
        run: python scripts/validate_chinese_comments.py --base "$BASE_SHA"
      - name: Ruff
        run: ruff check stiffgwpy_fast/__init__.py stiffgwpy_fast/cobaya/__init__.py stiffgwpy_fast/cobaya/stiffGW.py stiffgwpy_fast/_metrics.py stiffgwpy_fast/_resources.py stiffgwpy_fast/config.py stiffgwpy_fast/global_param.py stiffgwpy_fast/exact_background.py stiffgwpy_fast/freq_adaptive.py stiffgwpy_fast/reference.py scripts tests
      - name: Mypy
        run: python -m mypy
      - name: Compile and diff check
        run: |
          python -m compileall -q stiffgwpy_fast scripts tests
          git diff --check

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
      - name: Wheel and sdist build
        run: python -m build --sdist --wheel
      - name: Distribution archive boundary
        run: python scripts/verify_distribution.py dist
      - name: Installed wheel smoke test
        run: python scripts/smoke_installed_wheel.py dist/stiffgwpy_fast-*.whl

  cobaya:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Cobaya integration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev,cobaya]
      - name: Cobaya adapter smoke test
        run: python -m pytest -m cobaya -q

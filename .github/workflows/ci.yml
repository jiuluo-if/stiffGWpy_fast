name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .[dev,cobaya]
      - name: Lint (maintained modules/scripts/tests)
        # Legacy solver modules (functions.py, stiff_SGWB.py,
        # LCDM_stiff_Neff.py, fast_sgwb.py, global_param.py) carry
        # pre-existing style debt and are intentionally not in this gate.
        run: ruff check stiffgwpy/__init__.py stiffgwpy/cobaya/__init__.py stiffgwpy/cobaya/stiffGW.py stiffgwpy/_metrics.py scripts tests
      - name: Tests (fast unit tests; slow LSODA gates deselected by default)
        run: python -m pytest
      - name: Cobaya adapter smoke test
        run: python -m pytest -m cobaya -q
      - name: Wheel build gate
        run: python -m build --wheel

name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
      - name: Lint (maintained modules/scripts/tests)
        # Legacy solver modules (functions.py, stiff_SGWB.py,
        # LCDM_stiff_Neff.py, fast_sgwb.py) still carry pre-existing style
        # debt and are intentionally not in this gate. global_param.py is now
        # part of the maintained surface.
        run: ruff check stiffgwpy/__init__.py stiffgwpy/cobaya/__init__.py stiffgwpy/cobaya/stiffGW.py stiffgwpy/_metrics.py stiffgwpy/_resources.py stiffgwpy/config.py stiffgwpy/global_param.py stiffgwpy/exact_background.py stiffgwpy/freq_adaptive.py stiffgwpy/reference.py scripts tests
      - name: Type check maintained configuration surface
        run: python -m mypy
      - name: Tests (fast unit tests; slow LSODA gates deselected by default)
        run: python -m pytest
      - name: Coverage report (Python 3.11)
        if: matrix.python-version == '3.11'
        run: python -m pytest --cov=stiffgwpy --cov-report=term-missing:skip-covered --cov-report=xml
      - name: Upload coverage artifact (Python 3.11)
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
      - name: Wheel build gate
        run: python -m build --sdist --wheel
      - name: Installed wheel smoke test
        run: python scripts/smoke_installed_wheel.py dist/stiffgwpy-*.whl

  cobaya:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Cobaya integration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev,cobaya]
      - name: Cobaya adapter smoke test
        run: python -m pytest -m cobaya -q

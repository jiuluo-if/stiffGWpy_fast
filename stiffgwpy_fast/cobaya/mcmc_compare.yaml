# fast 与 LSODA 引擎对比 MCMC 使用的精简 run-info。
# 似然只读取本仓库提供的数据文件，不依赖 AlterBBN、外部 bbn_codes 或 mpi4py。
# 引擎、accuracy_mode、线程数和 h 等 stiffGW 参数由 scripts/mcmc_compare.py 在运行时覆盖。

theory:
  stiffGW:
    python_path: .

likelihood:
  PTA.NANOGrav:
    python_path: ./likelihoods
    kde_file: likelihoods/PTA/NANOGrav15yr/density_mock.npy
    log10rhogrid_file: likelihoods/PTA/NANOGrav15yr/log10rhogrid.npy
    freq_file: likelihoods/PTA/NANOGrav15yr/freqs.npy
  LIGO_SGWB.LVK_SGWB_CC:
    python_path: ./likelihoods
    CC_file: likelihoods/LIGO_SGWB/C_O1_O2_O3.dat

params:
  Omega_bh2:
    value: 0.0223828
    latex: \Omega_\mathrm{b} h^2
  Omega_ch2:
    value: 0.1201075
    latex: \Omega_\mathrm{c} h^2
  H0:
    value: 67.32117
    latex: H_0
  h:
    derived: 'lambda H0: H0/100'
    latex: h
  DN_eff:
    value: 0
    latex: \Delta N_\mathrm{eff}
  A_s:
    value: 2.100549e-9
    latex: A_\mathrm{s}
  log10r:
    prior:
      min: -40
      max: 0
    ref:
      dist: uniform
      loc: -3
      scale: 1
    proposal: 0.1
    latex: \log_{10}r
  r:
    value: 'lambda log10r: np.power(10.,log10r)'
    latex: r
  n_t:
    prior:
      min: -1
      max: 6
    ref:
      dist: uniform
      loc: 0
      scale: 1
    proposal: 0.01
    latex: n_\mathrm{t}
  cr:
    value: 0
  log10T_re:
    prior:
      min: -3.0
      max: 7.0
    ref:
      dist: uniform
      loc: -1.0
      scale: 1.0
    proposal: 0.01
    latex: \log_{10}(T_\mathrm{re}/\mathrm{GeV})
    drop: True
  T_re:
    value: 'lambda log10T_re: np.power(10.,log10T_re)'
    latex: T_\mathrm{re}
  DN_re:
    prior:
      min: 0
      max: 40
    ref:
      dist: uniform
      loc: 20
      scale: 10
    proposal: 0.1
    latex: \Delta N_\mathrm{re}
  log10kappa10:
    prior:
      min: -27
      max: 3
    ref:
      dist: uniform
      loc: -2
      scale: 2
    proposal: .1
    latex: \log_{10}\kappa_{10}
  kappa10:
    value: 'lambda log10kappa10: np.power(10.,log10kappa10)'
    latex: \kappa_{10}

  # 显式重复 NANOGrav 似然中的 nuisance 先验，并放入共享 run-info。
  # 这样可安全覆盖确定性初值，避免 Cobaya 将似然侧定义替换为仅含 ref 的派生参数。
  A_BBH:
    prior:
      min: -18
      max: -11
    ref:
      dist: uniform
      min: -16.5
      max: -14.5
    proposal: 0.01
    latex: \log_{10}\,h_{c,\mathrm{BH}}
  gamma_BBH:
    prior:
      min: 0
      max: 7
    ref:
      dist: uniform
      min: 4
      max: 5
    proposal: 0.01
    latex: \gamma_\mathrm{BH}

sampler:
  mcmc:
    proposal_scale: 2.4
    max_tries: 50d

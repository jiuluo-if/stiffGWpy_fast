# Reduced run-info for engine comparison MCMC (fast vs LSODA).
# Likelihoods use only the data files shipped inside this repository
# (no AlterBBN / external bbn_codes, no mpi4py requirement).
# The stiffGW theory engine is overridden at run time by
# scripts/mcmc_compare.py (engine / accuracy_mode / threads / h / ...).

theory:
  stiffGW:
    python_path: .

likelihood:
  PTA.NANOGrav:
    python_path: ./likelihoods
    kde_file: likelihoods/PTA/NANOGrav15yr/density_mock.npy
    log10rhogrid_file: likelihoods/PTA/NANOGrav15yr/log10rhogrid.npy
    freq_file: likelihoods/PTA/NANOGrav15yr/freqs.npy
  LIGO_SGWB.LVK_SGWB_CC:
    python_path: ./likelihoods
    CC_file: likelihoods/LIGO_SGWB/C_O1_O2_O3.dat

params:
  Omega_bh2:
    value: 0.0223828
    latex: \Omega_\mathrm{b} h^2
  Omega_ch2:
    value: 0.1201075
    latex: \Omega_\mathrm{c} h^2
  H0:
    value: 67.32117
    latex: H_0
  h:
    derived: 'lambda H0: H0/100'
    latex: h
  DN_eff:
    value: 0
    latex: \Delta N_\mathrm{eff}
  A_s:
    value: 2.100549e-9
    latex: A_\mathrm{s}
  log10r:
    prior:
      min: -40
      max: 0
    ref:
      dist: uniform
      loc: -3
      scale: 1
    proposal: 0.1
    latex: \log_{10}r
  r:
    value: 'lambda log10r: np.power(10.,log10r)'
    latex: r
  n_t:
    prior:
      min: -1
      max: 6
    ref:
      dist: uniform
      loc: 0
      scale: 1
    proposal: 0.01
    latex: n_\mathrm{t}
  cr:
    value: 0
  log10T_re:
    prior:
      min: -3.0
      max: 7.0
    ref:
      dist: uniform
      loc: -1.0
      scale: 1.0
    proposal: 0.01
    latex: \log_{10}(T_\mathrm{re}/\mathrm{GeV})
    drop: True
  T_re:
    value: 'lambda log10T_re: np.power(10.,log10T_re)'
    latex: T_\mathrm{re}
  DN_re:
    prior:
      min: 0
      max: 40
    ref:
      dist: uniform
      loc: 20
      scale: 10
    proposal: 0.1
    latex: \Delta N_\mathrm{re}
  log10kappa10:
    prior:
      min: -27
      max: 3
    ref:
      dist: uniform
      loc: -2
      scale: 2
    proposal: .1
    latex: \log_{10}\kappa_{10}
  kappa10:
    value: 'lambda log10kappa10: np.power(10.,log10kappa10)'
    latex: \kappa_{10}

  # Explicitly repeat the nuisance priors from PTA/NANOGrav.yaml. Keeping
  # them in the shared run-info makes an optional deterministic initial-point
  # override safe: Cobaya will not replace the likelihood-owned definition
  # with a ref-only (derived) parameter.
  A_BBH:
    prior:
      min: -18
      max: -11
    ref:
      dist: uniform
      min: -16.5
      max: -14.5
    proposal: 0.01
    latex: \log_{10}\,h_{c,\mathrm{BH}}
  gamma_BBH:
    prior:
      min: 0
      max: 7
    ref:
      dist: uniform
      min: 4
      max: 5
    proposal: 0.01
    latex: \gamma_\mathrm{BH}

sampler:
  mcmc:
    proposal_scale: 2.4
    max_tries: 50d

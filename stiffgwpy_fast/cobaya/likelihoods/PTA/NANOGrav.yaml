# Default resources and nuisance parameters for the NANOGrav adapter.
# NANOGrav 适配器的默认资源路径和 nuisance 参数。

path: null
kde_file: likelihoods/PTA/NANOGrav15yr/density_mock.npy
log10rhogrid_file: likelihoods/PTA/NANOGrav15yr/log10rhogrid.npy
freq_file: likelihoods/PTA/NANOGrav15yr/freqs.npy
Nfreqs: 14
# Alias used by Cobaya for this likelihood.
# Cobaya 使用的似然别名。
aliases: [NANOGrav15yr]
# Approximate likelihood evaluations per second after theory inputs are ready.
# 理论量计算完成后，每秒似然评估次数的近似值。
speed: 500


### Default values or priors of experimental model parameters (nuisance parameters), 
### accounting for instrumental errors, foregrounds, etc.
### Derived parameters are also specified here.

# For example, Planck likelihood parameters (or nuisance parameters). 
# They typically do not appear in the Cobaya input: they are included automatically at run time.
# However, one is still allowed to add them to the input to redefine any of their properties. 

params:
  # Log characteristic strain of the unresolved SMBHB background at 1/year.
  # 未分辨超大质量双黑洞背景在 1/year 处的对数特征应变。
  A_BBH:
    prior:
      dist: uniform
      min: -18
      max: -11
    ref:
      dist: uniform
      min: -16.5
      max: -14.5
    proposal: 0.01
    latex: \log_{10}\,h_{c,\mathrm{BH}}
  # Spectral index of the unresolved SMBHB background (canonical value 13/3).
  # 未分辨超大质量双黑洞背景的谱指数（标准情形为 13/3）。
  gamma_BBH:
    prior:
      dist: uniform
      min: 0
      max: 7
    ref:
      dist: uniform
      min: 4
      max: 5
    proposal: 0.01
    latex: \gamma_\mathrm{BH}
prior:
  # Correlated prior from Afzal et al. (2023); covariance values are unchanged.
  # Afzal et al.（2023）的相关先验；协方差数值保持不变。
  GWOnly-Ext: 'lambda A_BBH, gamma_BBH: stats.multivariate_normal.logpdf(
          [A_BBH, gamma_BBH], mean=[-15.6, 4.7], cov=[[0.28, -0.0026], [-0.0026, 0.12]])'

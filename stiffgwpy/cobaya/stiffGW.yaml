# stiffGW Cobaya 理论的默认选项。
#
# 注意：默认值统一写在这里；stiffGW.py 中只声明类型，不声明默认值。
# 如果两处同时声明值，Cobaya 3.6 会报重复选项错误。

# 如需使用本地理论代码，可填写路径；填写 'global' 可强制使用全局导入。
# 通过 pip 安装后，限定类名可以直接解析，不需要填写路径。
path: null

# 求解器引擎：
#   fast  - plain-grid 快速求解器（默认）
#   lsoda - 原始自适应 LSODA 路径
#   reference - 独立连续 sigma 精度路径
engine: fast

# engine='fast' 时，快速求解失败后是否使用 LSODA 路径重算。
fallback: True

# engine='fast' 时，频率并行内核使用的 OpenMP 线程数。
# 默认 8；运行时会限制到当前机器的线程上限。
fast_threads: 8

# engine='fast' 时的固定步长或膨胀网格间距。
# 0 表示使用预选 accuracy_mode（fast: 0.02）；非零值是覆盖预设的显式参数
# （详见 calculate()）。
h: 0

# engine='fast' 时的输出列步长，范围为 1–8；0 表示使用 accuracy_mode 预设。
col_step: 0

# 解析尾部阈值（z = ln(k/aH)）；0 表示使用 accuracy_mode 预设
# （fast: 5.0）；LSODA 路径保留自身默认值（5.0）。
z_tail: 0

# 频率网格密度；0 表示使用 accuracy_mode 预设（1.0 为默认网格）。
freq_res: 0

# 可选的原生求解节点：填写 log10(f/Hz) 列表，或每行一个 log10 f 的文本文件路径。
# 设置后会强制加入 fast 求解网格，避免 likelihood 或 f = 1/yr 的点计算在陡峭谱特征处
# 产生插值误差。默认 null 表示由求解器自行生成频率网格，likelihood 对返回谱进行插值。
# Layer C 在 11 个 PTA 频率 bin 上测得该插值的 dex 误差不超过 3.10e-4。
eval_freqs: null

# engine='fast'：命名精度预设。默认 'fast' 使用 plain-grid 速度优先设置。
# 对外档位为 'fast'（默认 plain-grid）
# 和 'production'（transition-refine，精度优先）；'reference'、'deep'、'debug' 仅用于
# 验证，不用于 MCMC 热路径；空字符串表示不选预设，只使用模块默认值和显式参数。
accuracy_mode: fast

# engine='fast' 时，如果所选档位的估计误差超过预算，则升级到 reference 档位。
# 该过程较慢，生产 MCMC 建议关闭。设置 likelihood_sigma 后使用 likelihood 感知门禁：
# |Delta logL| = 0.5 * (Delta_Neff_abs_error / likelihood_sigma)^2，并与 dlogl_tol 比较；
# 未设置时使用相对误差 error_tol。escalate_to_reference 为 True 时运行独立连续 sigma
# 流程，为 False 时仅收紧 fast 网格。
auto_escalate: False
error_tol: 0.005
likelihood_sigma: null
dlogl_tol: 0.001
escalate_to_reference: False

# engine='reference' 时，连续 sigma 高精度流程的容差。
reference_rtol: 1e-11
reference_z_tail: 5.0

### 本理论提供的派生参数。
### 必须与 get_can_provide_params() 以及 calculate() 写入 state['derived'] 的键一致。
params:
  Delta_Neff_GW:
    derived: True
    latex: \Delta N_\mathrm{eff,GW}
  Delta_Neff_total:
    derived: True
    latex: \Delta N_\mathrm{eff,total}
  log10hc_prim_fyr:
    derived: True
    latex: \log_{10}h_{c,\mathrm{prim}}
  f_end:
    derived: True
    latex: f_\mathrm{end}
  Delta_Neff_GW_error:
    derived: True
    latex: \sigma_{\Delta N_\mathrm{eff,GW}}

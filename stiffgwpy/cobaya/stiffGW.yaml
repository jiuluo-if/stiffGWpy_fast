# Default options for the stiffGW cobaya theory.
#
# NOTE: default *values* live here; the class in stiffGW.py declares the same
# options as type-only annotations (no values).  Declaring a value both here
# and in the class raises a duplicate-option error in Cobaya 3.6.

# Path to the local theory code, if desired, or 'global' to force a
# global-scope import.  When the package is pip-installed, the fully-qualified
# class name (stiffgwpy.cobaya.stiffGW.stiffGW) resolves without a path.
path: null

# Solver engine:
#   lsoda - original adaptive LSODA path (default, conservative)
#   fast  - experimental approximate fast solver; falls back to LSODA on
#           failure when `fallback: True`
engine: lsoda

# engine='fast': rerun with the LSODA path if the fast solve fails
fallback: True

# engine='fast': OpenMP threads for the frequency-parallel kernel.
# Default 8 (production science default; clamped to the machine's thread
# budget at call time).
fast_threads: 8

# engine='fast': fixed step size / expansion-grid spacing.
# 0 = use the preselected accuracy_mode (production: 0.01); a non-zero value
# is an explicit user override that wins over the preset (see calculate()).
h: 0

# engine='fast': output-column stride 1-8.  0 = use the accuracy_mode preset.
col_step: 0

# analytic-tail threshold (z = ln(k/aH)).  0 = use the accuracy_mode preset
# (production: 8.0); the LSODA path keeps its own default (5.0).
z_tail: 0

# frequency-grid density.  0 = use the accuracy_mode preset (1.0 = default grid).
freq_res: 0

# Optional native solve nodes: a list of log10(f/Hz) or a path to a text file
# (one log10 f per line).  If set, these are force-added to the fast solve grid
# so the likelihood (or a point evaluation at f = 1/yr) does not inherit
# interpolation error at steep spectral features.  The default (null) leaves the
# frequency grid to the solver and the likelihood interpolates over the returned
# spectrum.  Layer C measured the per-bin dex error of that interpolation at
# <= 3.10e-4 across 11 PTA-like bins (see docs/mcmc_posterior/is_pointwise.json).
eval_freqs: null

# engine='fast': named accuracy preset.  Default 'production' so that a plain
# engine: fast yaml runs at the transition-refine science settings (h=0.01,
# col_step=4, z_tail=8, freq_res=1, adaptive grid, 8 threads) -- NOT a coarser
# plain-grid scan.  User-facing fast profiles: 'fast' (plain-grid, speed-first)
# and 'production' (transition-refine, precision-first); 'reference' / 'deep' /
# 'debug' are validation variants only (not defined for the MCMC thermal path).
# '' = none (module defaults, explicit knobs only).
accuracy_mode: production

# engine='fast': escalate to the 'reference' mode when the estimated error of
# the selected mode exceeds the budget (slow; disable for production MCMC).
# With likelihood_sigma set, the gate is likelihood-aware:
#   |Delta logL| = 0.5 * (Delta_Neff_abs_error / likelihood_sigma)^2
# is compared against dlogl_tol; without it, the relative error_tol gate is
# used.  escalate_to_reference: True runs the independent continuous-sigma
# pipeline on escalation (very slow), False tightens the fast grid instead.
auto_escalate: False
error_tol: 0.005
likelihood_sigma: null
dlogl_tol: 0.001
escalate_to_reference: False

# engine='reference': continuous-sigma high-accuracy pipeline tolerances.
reference_rtol: 1e-11
reference_z_tail: 5.0

### Derived parameters provided by this theory.
### Must match get_can_provide_params() and the keys written into
### state['derived'] in calculate().
params:
  Delta_Neff_GW:
    derived: True
    latex: \Delta N_\mathrm{eff,GW}
  Delta_Neff_total:
    derived: True
    latex: \Delta N_\mathrm{eff,total}
  log10hc_prim_fyr:
    derived: True
    latex: \log_{10}h_{c,\mathrm{prim}}
  f_end:
    derived: True
    latex: f_\mathrm{end}
  Delta_Neff_GW_error:
    derived: True
    latex: \sigma_{\Delta N_\mathrm{eff,GW}}
